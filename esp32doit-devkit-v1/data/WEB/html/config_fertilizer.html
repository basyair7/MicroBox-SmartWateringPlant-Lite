<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="basyair7">
    <link rel="stylesheet" href="../css/config_fertilizer.css">
    <link rel="stylesheet" href="/css/config_fertilizer.css">
    <script src="../js/date_time_rtc.js"></script>
    <script src="/js/date_time_rtc.js"></script>
    <script src="../js/sweetalert.min.js"></script>
    <script src="/js/sweetalert.min.js"></script>

    <script type="text/javascript">
        function validateForm() {
            let ppm_target = document.getElementById("ppm_target");
            let ppm_tolerance = document.getElementById("ppm_tolerance");
            
            if (ppm_target.value.trim() === "" || ppm_tolerance.value.trim() === "") 
            {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "PPM TARGET or TOLERANCE input cannot be empty."
                });
                return false;
            }

            return true;
        }

        function validateFormTime() {
            let time = document.getElementById("time");
            let seconds = document.getElementById("seconds");
            let interval = document.getElementById("interval");

            if (interval.value.trim() === "") {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Interval input cannot be empty."
                });
                return false;
            }

            if (time.value.trim() === "") {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Time input cannot be empty."
                });
                return false;
            }

            if (seconds.value.trim() === "" || isNaN(seconds.value) || seconds.value < 0 || seconds.value >= 60) {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Seconds input must be a number between 0 and 59."
                });
                return false;
            }

            return true;
        }
    </script>

    <title>Setup Fertilizer - MicroBOX (Smart Watering Plant) %VERSIONPROJECT%</title>
</head>
<body>
    <main class="container">
        <h4>Setup Fertilizer</h4>
        <table>
            <tr>
                <td>Time</td>
                <td>:</td>
                <td>%TIME%</td>
            </tr>

            <tr>
                <td>Interval</td>
                <td>:</td>
                <td>%INTERVAL%</td>
            </tr>

            <tr>
                <td>PPM TARGET</td>
                <td>:</td>
                <td>%PPM_TARGET%</td>
            </tr>

            <tr>
                <td>PPM TOLERANCE (%)</td>
                <td>:</td>
                <td>%PPM_TOLERANCE%</td>
            </tr>
            
        </table>

        <form action="/save-config-fertilizer-time" method="post" onsubmit="return validateFormTime()">
            <table>
                <tr>
                    <td>Time (HH:MM)</td>
                    <td>:</td>
                    <td><input type="time" id="time" name="time" required></td>
                </tr>
                
                <tr>
                    <td>Seconds</td>
                    <td>:</td>
                    <td><input type="number" id="seconds" name="seconds" min="0" max="59" required></td>
                </tr>

                <tr>
                    <td>Interval (Days)</td>
                    <td>:</td>
                    <td><input type="number" id="interval" name="interval" min="1" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td><button type="submit">Save</button></td>
                </tr>
            </table>
        </form>

        <form action="/save-config-fertilizer" method="post" onsubmit="return validateForm()">
            <table>
                <tr>
                    <td>PPM TARGET</td>
                    <td>:</td>
                    <td><input type="number" id="ppm_target" name="ppm_target" required></td>
                </tr>
                
                <tr>
                    <td>PPM TOLERANCE (%)</td>
                    <td>:</td>
                    <td><input type="number" id="ppm_tolerance" name="ppm_tolerance" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td><button type="submit">Save</button></td>
                </tr>
            </table>
        </form>
        <table>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td>
                        <a href="http://%LOCALIP%/recovery" class="button">Return to Menu</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- <footer>
            <p>
                <b>Powered by : <a href="https://github.com/basyair7">Basyair7</a></b>
            </p>
        </footer> -->
    </main>
</body>
