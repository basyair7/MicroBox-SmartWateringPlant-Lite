<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="basyair7">
    <link rel="stylesheet" href="../css/config_watering.css">
    <link rel="stylesheet" href="/css/config_watering.css">
    <script src="../js/date_time_rtc.js"></script>
    <script src="/js/date_time_rtc.js"></script>
    <script src="../js/sweetalert.min.js"></script>
    <script src="/js/sweetalert.min.js"></script>

    <script type="text/javascript">
        function validateForm() {
            let time_start = document.getElementById("time_start");
            let time_end   = document.getElementById("time_end");
            let interval = document.getElementById("interval");

            let watering_lvl_max = document.getElementById("watering_lvl_max");
            let watering_lvl_min = document.getElementById("watering_lvl_min");

            if (watering_lvl_max.value.trim() === "" || watering_lvl_min.value.trim() === "") 
            {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Watering Level input cannot be empty."
                });
                return false;
            }

            if (interval.value.trim() === "") {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Interval input cannot be empty."
                });
                return false;
            }

            if (time_start.value.trim() === "" && time_end.value.trim() === "") {
                Swal.fire({
                    icon: "warning",
                    title: "Warning",
                    text: "Time input cannot be empty."
                });
                return false;
            }

            return true;
        }
    </script>

    <title>Setup Watering - MicroBOX (Smart Watering Plant) %VERSIONPROJECT%</title>
</head>
<body>
    <main class="container">
        <h4>Setup Watering</h4>
        <table>
            <tr>
                <td>Time</td>
                <td>:</td>
                <td>%TIME%</td>
            </tr>

            <tr>
                <td>Interval</td>
                <td>:</td>
                <td>%INTERVAL%</td>
            </tr>

            <tr>
                <td>WATERING LEVEL MAX (%)</td>
                <td>:</td>
                <td>%WATERING_LVL_MAX%</td>
            </tr>

            <tr>
                <td>WATERING LEVEL MIN (%)</td>
                <td>:</td>
                <td>%WATERING_LVL_MIN%</td>
            </tr>
            
        </table>

        <form action="/save-config-watering-time" method="post" onsubmit="return validateForm()">
            <table>
                <tr>
                    <td>Time Start (HH:MM)</td>
                    <td>:</td>
                    <td><input type="time" id="time_start" name="time_start" required></td>
                </tr>

                <tr>
                    <td>Time End (HH:MM)</td>
                    <td>:</td>
                    <td><input type="time" id="time_end" name="time_end" required></td>
                </tr>

                <tr>
                    <td>Interval (Days)</td>
                    <td>:</td>
                    <td><input type="number" id="interval" name="interval" min="1" required></td>
                </tr>

                <tr>
                    <td></td>
                    <td></td>
                    <td><button type="submit">Save</button></td>
                </tr>
            </table>
        </form>

        <form action="/save-config-watering">
            <table>
                <tr>
                    <td>Watering Level Max (%)</td>
                    <td>:</td>
                    <td><input type="number" id="watering_lvl_max" name="watering_lvl_max" required></td>
                </tr>
                
                <tr>
                    <td>Watering Level Min (%)</td>
                    <td>:</td>
                    <td><input type="number" id="watering_lvl_min" name="watering_lvl_min" required></td>
                </tr>
                <tr>
                    <td></td>
                    <td></td>
                    <td><button type="submit">Save</button></td>
                </tr>
            </table>
        </form>
        <table>
            <tbody>
                <tr>
                    <td></td>
                    <td></td>
                    <td>
                        <a href="http://%LOCALIP%/recovery" class="button">Return to Menu</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <!-- <footer>
            <p>
                <b>Powered by : <a href="https://github.com/basyair7">Basyair7</a></b>
            </p>
        </footer> -->
    </main>
</body>
